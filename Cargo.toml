[package]
name = "jj-hunk"
version = "0.4.1"
edition = "2021"
description = "Programmatic hunk selection for jj"
license = "MIT"
repository = "https://github.com/laulauland/jj-hunk"

[features]
# Contract only: the hunkset semantic predicates (function, scope, doc,
# import, toplevel, depth, annotation) compile against this flag and return
# a clear error when it is off. The tree-sitter analyzer that implements it
# is added by the alberto/tree-sitter-semantic branch, which redefines this
# list with its grammar dependencies.
semantic = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
anyhow = "1"
walkdir = "2"
serde_yaml = "0.9"
sha2 = "0.10"
regex = "1"
thiserror = "2"
